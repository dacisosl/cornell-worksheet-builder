<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코넬 학습지 빌더</title>
<style>
/* ============================================================
   코넬 학습지 빌더 — 스타일 (stationery 미학 유지 + 이미지 객체 시스템)
   ============================================================ */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap');

:root{
  --paper:#FCFBF6; --paper-tint:#F6F3E8;
  --ink:#2B2A26; --ink-soft:#6E6A60; --ink-faint:#A8A399;
  --rule:#B9CADB; --rule-grid:#DBE3EA; --margin-red:#DCA0A0;
  --accent:#2E4B73; --accent-2:#B7472A; --accent-soft:#E9EEF4;
  --app-bg:#E8E5DC; --panel:#FFFFFF; --panel-2:#F7F6F2;
  --line:#E2DFD5; --line-strong:#34322C;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --shadow-card:0 1px 2px rgba(40,38,32,.06),0 8px 24px rgba(40,38,32,.08);
  --shadow-sheet:0 2px 4px rgba(40,38,32,.08),0 20px 60px rgba(40,38,32,.16);
  --sans:'Pretendard',system-ui,sans-serif; --serif:'Nanum Myeongjo',serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--sans);color:var(--ink);background:var(--app-bg);-webkit-font-smoothing:antialiased;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}

.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:296px 1fr;
  grid-template-areas:"brand topbar" "sidebar canvas";height:100vh;}

.brand{grid-area:brand;display:flex;align-items:center;gap:11px;padding:0 20px;
  background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;color:#fff;flex:none;position:relative;}
.brand .mark::before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:1.5px;background:rgba(255,255,255,.55);}
.brand .mark::after{content:"";position:absolute;left:5px;right:5px;bottom:8px;height:1.5px;background:rgba(255,255,255,.55);}
.brand h1{font-family:var(--serif);font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em;white-space:nowrap;}
.brand h1 span{color:var(--ink-soft);font-weight:400;}

.topbar{grid-area:topbar;display:flex;align-items:center;gap:10px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--line);}
.topbar .spacer{flex:1;}
.toolgroup{display:flex;align-items:center;gap:2px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-md);padding:3px;}
.zbtn{border:none;background:transparent;color:var(--ink-soft);width:30px;height:28px;border-radius:6px;font-size:16px;display:grid;place-items:center;}
.zbtn:hover{background:#fff;color:var(--ink);}
.zlabel{font-size:12.5px;color:var(--ink-soft);min-width:42px;text-align:center;font-variant-numeric:tabular-nums;}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap;}
.tbtn:hover{border-color:#cfcabd;background:#fff;}
.tbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.tbtn.primary:hover{background:#25395a;}
.tbtn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.tbtn.ghost:hover{background:var(--panel-2);color:var(--ink);}
.tbtn svg{width:15px;height:15px;}

.sidebar{grid-area:sidebar;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 16px 40px;}
.side-h{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:4px 4px 12px;white-space:nowrap;}
.side-section+.side-section{margin-top:26px;}
.palette{display:flex;flex-direction:column;gap:12px;}
.pcard{text-align:left;width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-md);
  padding:13px 13px 14px;display:grid;grid-template-columns:74px 1fr;gap:13px;align-items:center;
  transition:border-color .14s,box-shadow .14s,transform .06s;}
.pcard:hover{border-color:var(--accent);box-shadow:var(--shadow-card);}
.pcard:active{transform:translateY(1px);}
.pcard .pthumb{width:74px;height:60px;border-radius:7px;border:1.5px solid var(--line-strong);background:var(--paper);overflow:hidden;position:relative;flex:none;}
.pcard .ptitle{font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 3px;}
.pcard .pdesc{font-size:11.5px;line-height:1.45;color:var(--ink-soft);margin:0;}
.th-row{position:absolute;inset:6px;display:flex;gap:4px;}
.th-col{position:absolute;inset:6px;display:flex;flex-direction:column;gap:4px;}
.th-box{border:1px solid var(--ink-faint);border-radius:2px;background:#fff;}
.th-box.fill{background:var(--accent-soft);border-color:var(--accent);}
.th-lines{background-image:repeating-linear-gradient(transparent 0 5px,var(--rule) 5px 6px);}
.th-bar{height:9px;flex:none;}
.side-note{font-size:11.5px;line-height:1.55;color:var(--ink-soft);background:var(--panel-2);
  border:1px dashed var(--line);border-radius:var(--r-md);padding:11px 12px;}
.side-note b{color:var(--ink);font-weight:700;}
.opt-row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;}
.opt-row+.opt-row{border-top:1px solid var(--line);}
.opt-row label{font-size:12.5px;color:var(--ink);font-weight:500;}
.opt-row>label:first-child{white-space:nowrap;}
.switch{position:relative;width:38px;height:22px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:#d3cfc4;border-radius:999px;transition:.16s;}
.switch .track::before{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch input:checked+.track{background:var(--accent);}
.switch input:checked+.track::before{transform:translateX(16px);}

.canvas{grid-area:canvas;overflow:auto;padding:36px 36px 120px;
  background:radial-gradient(circle at 1px 1px,rgba(40,38,32,.05) 1px,transparent 0);background-size:22px 22px;}
.sheet-wrap{display:flex;justify-content:center;min-width:min-content;}
.sheet{width:794px;min-height:1123px;background:var(--paper);box-shadow:var(--shadow-sheet);border-radius:2px;
  position:relative;padding:46px 52px 60px;transform-origin:top center;}
.sheet::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:1.5px;background:var(--margin-red);opacity:.5;pointer-events:none;}
.sheet-head{margin-bottom:22px;}
.sheet-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);font-weight:700;margin-bottom:7px;}
.sheet-title{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.15;color:var(--ink);outline:none;margin:0 0 14px;border-bottom:2.5px solid var(--ink);padding-bottom:12px;}
.sheet-title:empty::before{content:attr(data-ph);color:var(--ink-faint);font-weight:400;}
.sheet-meta{display:flex;gap:26px;font-size:13px;color:var(--ink-soft);}
.meta-field{display:flex;align-items:flex-end;gap:8px;}
.meta-field span{font-weight:600;color:var(--ink);white-space:nowrap;}
.meta-line{display:inline-block;min-width:96px;border-bottom:1px solid var(--ink-faint);}

.stack{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;align-content:flex-start;}
.block.half{width:calc(50% - 9px);}
.empty{border:2px dashed #cdc7b8;border-radius:var(--r-lg);padding:60px 30px;text-align:center;color:var(--ink-soft);background:rgba(255,255,255,.4);}
.empty .big{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:8px;font-weight:700;}
.empty p{margin:0;font-size:13.5px;line-height:1.6;}

.block{border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:#fff;position:relative;
  display:flex;flex-direction:column;flex:0 0 auto;width:100%;break-inside:avoid;}
.block.dragging{opacity:.4;}
.block.drop-before{box-shadow:0 -3px 0 var(--accent);}
.block.drop-after{box-shadow:0 3px 0 var(--accent);}
.block.over::after{content:"⚠ A4 한 쪽 높이를 넘어요";position:absolute;right:10px;top:-11px;z-index:9;
  background:#fbeaea;color:var(--accent-2);font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid #e9c9c9;white-space:nowrap;}

.bhead{display:flex;align-items:center;gap:8px;padding:7px 9px 7px 11px;border-bottom:1.5px solid var(--line-strong);background:var(--panel-2);border-radius:4px 4px 0 0;}
.btag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;background:var(--accent);padding:3px 10px;border-radius:4px;letter-spacing:.01em;white-space:nowrap;flex:none;}
.btag.alt{background:var(--accent-2);}
.btag .num{font-variant-numeric:tabular-nums;}
.btitle-input{border:none;background:transparent;outline:none;font-family:var(--serif);font-weight:700;font-size:15.5px;color:var(--ink);flex:1;min-width:0;padding:2px 4px;border-radius:4px;}
.btitle-input:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--line);}
.btitle-input::placeholder{color:var(--ink-faint);font-weight:400;}
.bctrl{display:flex;align-items:center;gap:2px;margin-left:auto;}
.icbtn{border:none;background:transparent;color:var(--ink-soft);width:28px;height:28px;border-radius:6px;display:grid;place-items:center;}
.icbtn:hover{background:#fff;color:var(--ink);}
.icbtn.danger:hover{background:#fbeaea;color:var(--accent-2);}
.icbtn svg{width:15px;height:15px;}
.icbtn:disabled{opacity:.3;cursor:default;}

.opt-wrap{position:relative;}
.popover{position:absolute;right:0;top:34px;z-index:30;width:222px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:11px;display:none;}
.popover.open{display:block;}
.pop-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:4px 2px 7px;}
.pop-h:not(:first-child){margin-top:13px;}
.seg{display:flex;gap:5px;}
.seg button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:8px 4px 6px;font-size:11px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:5px;}
.seg button .ico{width:26px;height:18px;border:1px solid var(--ink-faint);border-radius:2px;background:#fff;}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.seg button.on .ico{border-color:var(--accent);}
.ico.lines{background-image:repeating-linear-gradient(transparent 0 4px,var(--rule) 4px 5px);}
.ico.grid{background-image:repeating-linear-gradient(transparent 0 4px,var(--rule-grid) 4px 5px),repeating-linear-gradient(90deg,transparent 0 4px,var(--rule-grid) 4px 5px);}
.ico.tint{background:var(--paper-tint);}
.pop-btn{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px;font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px;}
.pop-btn:hover{border-color:var(--accent);color:var(--accent);background:#fff;}
.pop-btn svg{width:14px;height:14px;}

.bbody{display:flex;flex:1;min-height:0;}
.bbody.col{flex-direction:column;}
.panel{position:relative;min-width:0;display:flex;flex-direction:column;}
.panel-label{position:absolute;top:7px;left:9px;z-index:2;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);text-transform:uppercase;white-space:nowrap;pointer-events:none;background:rgba(255,255,255,.7);padding:0 4px;border-radius:3px;}
.field{flex:1;outline:none;overflow:auto;padding:26px 14px 14px;font-size:14.5px;line-height:32px;color:var(--ink);min-height:60px;}
.field:empty::before{content:attr(data-ph);color:var(--ink-faint);}
.field.has-img:empty::before{content:none;}
.field img{max-width:100%;height:auto;}
.field.bg-lines{background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 26px;}
.field.bg-grid{background-image:repeating-linear-gradient(transparent 0 31px,var(--rule-grid) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,var(--rule-grid) 31px 32px);background-position:0 26px,0 0;}
.field.tint{background-color:var(--paper-tint);}

.vdiv{width:1.5px;background:var(--line-strong);position:relative;flex:none;cursor:col-resize;}
.vdiv::after{content:"";position:absolute;inset:0 -5px;}
.vdiv:hover{background:var(--accent);}
.hdiv{height:1.5px;background:var(--line-strong);}
.hdiv.adjustable{position:relative;cursor:row-resize;flex:none;}
.hdiv.adjustable::after{content:"";position:absolute;inset:-5px 0;}
.hdiv.adjustable:hover{background:var(--accent);box-shadow:0 0 0 1px var(--accent);}

/* ===== 이미지 도구 / 객체 ===== */
.field-tools{position:absolute;top:5px;right:6px;z-index:6;display:flex;gap:4px;opacity:0;transition:opacity .12s;}
.panel:hover .field-tools{opacity:1;}
.minibtn{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:11px;font-weight:600;height:26px;padding:0 9px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;}
.minibtn:hover{border-color:var(--accent);color:var(--accent);}
.minibtn svg{width:13px;height:13px;}
.panel.drag-over{box-shadow:inset 0 0 0 2px var(--accent);}

.img-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.imgobj{position:absolute;pointer-events:auto;cursor:grab;touch-action:none;}
.imgobj.moving{cursor:grabbing;}
.imgobj img{width:100%;height:auto;display:block;border-radius:3px;
  user-select:none;-webkit-user-drag:none;box-shadow:0 1px 3px rgba(40,38,32,.18);background:#fff;}
.imgobj.selected img{box-shadow:0 0 0 1.5px var(--accent),0 2px 8px rgba(40,38,32,.18);}
.ihandle{position:absolute;width:13px;height:13px;background:#fff;border:1.5px solid var(--accent);border-radius:3px;display:none;z-index:2;}
.imgobj.selected .ihandle{display:block;}
.ihandle.nw{left:-7px;top:-7px;cursor:nwse-resize;}
.ihandle.ne{right:-7px;top:-7px;cursor:nesw-resize;}
.ihandle.sw{left:-7px;bottom:-7px;cursor:nesw-resize;}
.ihandle.se{right:-7px;bottom:-7px;cursor:nwse-resize;}
.img-tb{position:absolute;top:-36px;left:50%;transform:translateX(-50%);display:none;gap:1px;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:var(--shadow-card);white-space:nowrap;z-index:3;}
.imgobj.selected .img-tb{display:flex;}
.tbb{min-width:27px;height:27px;border:none;background:transparent;border-radius:6px;color:var(--ink-soft);font-size:16px;font-weight:600;display:grid;place-items:center;padding:0 4px;}
.tbb:hover{background:var(--panel-2);color:var(--accent);}
.tbb.on{background:var(--accent-soft);color:var(--accent);}
.tbb.danger:hover{background:#fbeaea;color:var(--accent-2);}
.tbb svg{width:15px;height:15px;}
.galign{position:absolute;background:var(--accent-2);pointer-events:none;z-index:7;opacity:.85;}
.galign.v{width:1px;top:0;bottom:0;}
.galign.h{height:1px;left:0;right:0;}

.resize-h{height:14px;cursor:ns-resize;position:relative;display:grid;place-items:center;border-top:1px dashed transparent;}
.resize-h::after{content:"";width:38px;height:4px;border-radius:3px;background:var(--ink-faint);opacity:.35;transition:opacity .12s,background .12s;}
.block:hover .resize-h::after{opacity:.6;}
.resize-h:hover::after{opacity:1;background:var(--accent);width:54px;}
.size-badge{position:absolute;right:8px;bottom:2px;font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .12s;}
.block:hover .size-badge{opacity:1;}

.page-guides{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:1;}
.pbreak{position:absolute;left:0;right:0;border-top:1.5px dashed #c9b8b8;}
.pcont{position:absolute;left:52px;right:52px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:6px;border-bottom:1.6px solid var(--line-strong);}
.pcont .pc-title{display:flex;align-items:baseline;gap:9px;min-width:0;}
.pcont .pc-eyebrow{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-2);font-weight:700;white-space:nowrap;}
.pcont .pc-name{font-family:var(--serif);font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcont .pc-page{font-size:10px;color:var(--ink-soft);letter-spacing:.05em;white-space:nowrap;}
.pbreak span{position:absolute;right:6px;top:-9px;font-size:9.5px;color:#b59a9a;background:var(--paper);padding:0 6px;letter-spacing:.05em;}

@media print{
  @page{size:A4;margin:12mm;}
  body{background:#fff;overflow:visible;}
  .app{display:block;height:auto;}
  .brand,.topbar,.sidebar{display:none !important;}
  .canvas{overflow:visible;padding:0;background:none;}
  .sheet{width:auto;min-height:0;box-shadow:none;transform:none !important;padding:0;border-radius:0;}
  .sheet::before{left:0;}
  .page-guides,.bctrl,.resize-h,.field-tools,.size-badge,.ihandle,.img-tb,.galign{display:none !important;}
  .block{box-shadow:none !important;margin-top:0 !important;}
  .block.over::after{display:none !important;}
  .field{overflow:visible;}
  .imgobj{box-shadow:none;}
  .imgobj img{box-shadow:none !important;}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ============================================================
   코넬 학습지 빌더 — 앱 로직 (vanilla JS) + 이미지 객체 시스템
   ============================================================ */
(function(){
  'use strict';

  const STORE_KEY='cornell-worksheet-v2';
  const PAGE_H=1123;         // A4 @96dpi
  const PAGE_MARGIN=30;      // 쪽 맞춤 여유
  const CONT_H=46;           // 2쪽~ 상단 '이어서' 헤더가 차지하는 높이
  const CONTENT_H=1017;
  const SNAP=6, GRID=8;
  const DEFAULTS={
    problem:{h:340,ratio:0.5,solBg:'lines',probBg:'blank'},
    concept:{h:250,exBg:'lines',tint:false},
    mock:{h:510,ratio:0.45,solBg:'lines',probBg:'blank'},
  };

  /* ---------- 상태 ---------- */
  let state=load(); let seeded=false;
  if(!state){state={meta:{title:'',showHead:true,grid:true,pageFit:true},blocks:[]};seeded=true;}
  if(!state.meta) state.meta={title:'',showHead:true,grid:true,pageFit:true};
  if(state.meta.grid===undefined) state.meta.grid=true;
  if(state.meta.pageFit===undefined) state.meta.pageFit=true;
  let seq=state.blocks.reduce((m,b)=>Math.max(m,b.id),0)+1;
  let imgSeq=state.blocks.reduce((m,b)=>Math.max(m,(b.imgs||[]).reduce((mm,im)=>Math.max(mm,im.id),0)),0)+1;
  let selected=null; // {b:blockId, i:imgId}

  /* ---------- 유틸 ---------- */
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>[...r.querySelectorAll(s)];
  function el(tag,props={},kids=[]){
    const e=document.createElement(tag);
    for(const k in props){
      if(k==='class')e.className=props[k];
      else if(k==='html')e.innerHTML=props[k];
      else if(k==='text')e.textContent=props[k];
      else if(k.startsWith('on'))e.addEventListener(k.slice(2),props[k]);
      else if(k==='data')for(const d in props[k])e.dataset[d]=props[k][d];
      else if(props[k]!=null)e.setAttribute(k,props[k]);
    }
    (Array.isArray(kids)?kids:[kids]).forEach(c=>{
      if(c==null)return;
      e.appendChild(typeof c==='string'?document.createTextNode(c):c);
    });
    return e;
  }
  function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
  function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){return null;}}
  let saveT; function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(save,400);}
  let pagT; function paginateSoon(){clearTimeout(pagT);pagT=setTimeout(paginate,60);}

  /* ---------- 아이콘 ---------- */
  const I={

  /* ============================================================
     이미지 화질 보정 (언샤프 마스크) — 원본은 손실 없이 보존
     ============================================================ */
  function boxBlur(d,w,h){
    const tmp=new Float32Array(d.length), out=new Uint8ClampedArray(d.length);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      for(let k=0;k<3;k++){
        const a=d[(y*w+Math.max(0,x-1))*4+k], b=d[i+k], c=d[(y*w+Math.min(w-1,x+1))*4+k];
        tmp[i+k]=(a+b+c)/3;
      }
      tmp[i+3]=d[i+3];
    }
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      for(let k=0;k<3;k++){
        const a=tmp[(Math.max(0,y-1)*w+x)*4+k], b=tmp[i+k], c=tmp[(Math.min(h-1,y+1)*w+x)*4+k];
        out[i+k]=(a+b+c)/3;
      }
      out[i+3]=tmp[i+3];
    }
    return out;
  }
  function unsharp(img,amount){
    const w=img.naturalWidth, h=img.naturalHeight;
    if(!w||!h) return null;
    if(w*h>6_000_000) return null; // 너무 큰 이미지는 보정 생략(렉 방지)
    const amt=(amount==null?0.8:amount);
    try{
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
      ctx.drawImage(img,0,0);
      const src=ctx.getImageData(0,0,w,h);
      const blur=boxBlur(src.data,w,h);
      const out=ctx.createImageData(w,h);
      const s=src.data, od=out.data;
      for(let i=0;i<s.length;i+=4){
        for(let k=0;k<3;k++){let v=s[i+k]+amt*(s[i+k]-blur[i+k]); od[i+k]=v<0?0:v>255?255:v;}
        od[i+3]=s[i+3];
      }
      ctx.putImageData(out,0,0);
      return c.toDataURL('image/png'); // PNG = 무손실
    }catch(e){return null;}
  }

  /* ============================================================
     이미지 인입 (Ctrl+V / 드롭 / 파일선택)
     ============================================================ */
  function ingestFile(block,file){
    if(!file||!file.type.startsWith('image/'))return;
    const r=new FileReader();
    r.onload=()=>ingestDataURL(block,r.result);
    r.readAsDataURL(file);
  }
  function ingestDataURL(block,dataURL){
    const im=new Image();
    im.onload=()=>{
      const ar=(im.naturalHeight/im.naturalWidth)||0.6;
      const sharp=unsharp(im); // 캡처 글자 또렷하게
      addImage(block,{src:dataURL,sharpSrc:sharp,ar});
    };
    im.onerror=()=>addImage(block,{src:dataURL,sharpSrc:null,ar:0.6});
    im.src=dataURL;
  }
  function addImage(block,{src,sharpSrc,ar}){
    syncFromDOM();
    block.imgs=block.imgs||[];
    const n=block.imgs.length;
    const id=imgSeq++;
    // 새 이미지는 살짝 어긋나게 쌓이도록 오프셋
    const off=Math.min(0.04*n,0.2);
    block.imgs.push({id,src,sharpSrc:sharpSrc||null,sharpened:!!sharpSrc,ar,x:0.12+off,y:0.06+off,w:0.72});
    save(); render(); selectImage(block.id,id);
  }

  function attachPaste(field,block){
    field.addEventListener('paste',e=>{
      const items=e.clipboardData&&e.clipboardData.items;
      if(!items)return;
      for(const it of items){
        if(it.type&&it.type.startsWith('image/')){
          const f=it.getAsFile();
          if(f){e.preventDefault(); ingestFile(block,f); return;}
        }
      }
    });
  }
  function enableImageDrop(panel,block){
    ['dragenter','dragover'].forEach(ev=>panel.addEventListener(ev,e=>{
      if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();panel.classList.add('drag-over');}
    }));
    ['dragleave','drop'].forEach(ev=>panel.addEventListener(ev,e=>{
      if(ev==='drop'){
        const fs=e.dataTransfer.files;
        if(fs&&fs.length){e.preventDefault();[...fs].forEach(f=>ingestFile(block,f));}
      }
      panel.classList.remove('drag-over');
    }));
  }

  /* ============================================================
     블록 생성
     ============================================================ */
  function makeBlock(type){
    const d=DEFAULTS[type];
    const base={id:seq++,type,h:d.h};
    if(type==='problem')return Object.assign(base,{ratio:d.ratio,solBg:d.solBg,probBg:d.probBg,title:'',probHtml:'',solHtml:'',imgs:[]});
    if(type==='concept')return Object.assign(base,{exBg:d.exBg,tint:d.tint,title:'',exHtml:''});
    if(type==='mock')return Object.assign(base,{ratio:d.ratio,solBg:d.solBg,probBg:d.probBg,title:'',probHtml:'',solHtml:'',imgs:[]});
  }
  function addBlock(type){syncFromDOM();state.blocks.push(makeBlock(type));save();render();}

  /* ---------- DOM → 모델 동기화 ---------- */
  function syncFromDOM(){
    $$('.block').forEach(node=>{
      const id=+node.dataset.id;
      const b=state.blocks.find(x=>x.id===id); if(!b)return;
      const prob=$('.field.f-prob',node), sol=$('.field.f-sol',node), ex=$('.field.f-ex',node), titleI=$('.btitle-input',node);
      if(prob)b.probHtml=prob.innerHTML;
      if(sol)b.solHtml=sol.innerHTML;
      if(ex)b.exHtml=ex.innerHTML;
      if(titleI)b.title=titleI.value;
    });
  }

  /* ============================================================
     렌더
     ============================================================ */
  const stackEl=()=>$('#stack');
  function render(){
    const stack=stackEl(); stack.innerHTML='';
    if(!state.blocks.length){
      stack.appendChild(el('div',{class:'empty'},[
        el('div',{class:'big',text:'학습지가 비어 있어요'}),
        el('p',{html:'왼쪽에서 블록을 골라 추가하세요.<br>문제풀이 · 개념설명 · 모의고사 블록을 자유롭게 조합할 수 있습니다.'}),
      ]));
    }else{
      let n={problem:0,concept:0,mock:0};
      state.blocks.forEach((b,i)=>{n[b.type]++;stack.appendChild(renderBlock(b,i,n[b.type]));});
    }
    requestAnimationFrame(paginate);
  }
  function bgClass(mode){return mode==='lines'?'bg-lines':mode==='grid'?'bg-grid':'';}

  function field(cls,ph,html,extra){
    const f=el('div',{class:'field '+cls+(extra?' '+extra:''),contenteditable:'true',spellcheck:'false',data:{ph}});
    f.innerHTML=html||'';
    f.addEventListener('input',()=>{syncOne(f);scheduleSave();});
    return f;
  }
  function syncOne(node){
    const block=node.closest('.block'); if(!block)return;
    const b=state.blocks.find(x=>x.id===+block.dataset.id); if(!b)return;
    if(node.classList.contains('f-prob'))b.probHtml=node.innerHTML;
    else if(node.classList.contains('f-sol'))b.solHtml=node.innerHTML;
    else if(node.classList.contains('f-ex'))b.exHtml=node.innerHTML;
  }

  function renderBlock(b,idx,typeNum){
    const node=el('div',{class:'block'+(b.type==='mock'?' half':''),data:{id:b.id}});
    node.style.height=b.h+'px';
    const isMock=b.type==='mock';
    const tagText=b.type==='problem'?'문제':b.type==='concept'?'개념':'모의고사';
    const tag=el('div',{class:'btag'+(isMock?' alt':'')},[tagText,b.type==='concept'?null:el('span',{class:'num',text:' '+typeNum})]);
    const titleInput=el('input',{class:'btitle-input',value:b.title||'',
      placeholder:b.type==='concept'?'개념 이름을 입력하세요':'제목(선택) 입력',
      oninput:e=>{b.title=e.target.value;scheduleSave();}});
    const ctrl=el('div',{class:'bctrl'},[
      makeOptions(b,node),
      iconBtn(I.up,'위로',()=>move(b.id,-1),idx===0),
      iconBtn(I.down,'아래로',()=>move(b.id,+1),idx===state.blocks.length-1),
      iconBtn(I.trash,'삭제',()=>del(b.id),false,'danger'),
    ]);
    const grip=el('span',{class:'icbtn',title:'드래그하여 이동',html:I.grip,style:'cursor:grab'});
    grip.setAttribute('draggable','true'); attachDrag(grip,node,b);
    node.appendChild(el('div',{class:'bhead'},[grip,tag,titleInput,ctrl]));

    if(b.type==='problem'||b.type==='mock'){
      const prob=field('f-prob '+bgClass(b.probBg),'문제 입력 · 캡처는 Ctrl+V로 붙여넣기',b.probHtml);
      const sol=field('f-sol '+bgClass(b.solBg),'풀이 공간',b.solHtml);
      const layer=el('div',{class:'img-layer'});
      const probPanel=el('div',{class:'panel imgpanel',style:'flex:1'},[
        el('span',{class:'panel-label',text:'문제'}),imgTools(b),prob,layer,
      ]);
      attachPaste(prob,b); enableImageDrop(probPanel,b);
      requestAnimationFrame(()=>renderImages(b,layer));
      const solPanel=el('div',{class:'panel',style:'flex:1'},[el('span',{class:'panel-label',text:'풀이'}),sol]);

      if(b.type==='problem'){
        probPanel.style.flex=b.ratio; solPanel.style.flex=1-b.ratio;
        const vdiv=el('div',{class:'vdiv',title:'드래그하여 비율 조절'}); enableSplit(vdiv,node,b);
        node.appendChild(el('div',{class:'bbody'},[probPanel,vdiv,solPanel]));
      }else{
        if(b.ratio==null)b.ratio=DEFAULTS.mock.ratio;
        probPanel.style.flex=b.ratio; solPanel.style.flex=1-b.ratio;
        const hdiv=el('div',{class:'hdiv adjustable',title:'드래그하여 문제·풀이 비율 조절'}); enableVSplit(hdiv,node,b);
        node.appendChild(el('div',{class:'bbody col'},[probPanel,hdiv,solPanel]));
      }
    }else{
      const ex=field('f-ex '+bgClass(b.exBg),'개념 설명을 작성하세요',b.exHtml,b.tint?'tint':'');
      const exPanel=el('div',{class:'panel',style:'flex:1'},[ex]);
      node.appendChild(el('div',{class:'bbody col'},[exPanel]));
    }

    const badge=el('span',{class:'size-badge',text:sizeLabel(b.h)});
    const rh=el('div',{class:'resize-h',title:'드래그하여 높이 조절'}); enableResize(rh,node,b,badge);
    node.appendChild(rh); node.appendChild(badge);
    return node;
  }

  function sizeLabel(h){
    const frac=h/CONTENT_H; let f='';
    if(Math.abs(frac-1/3)<0.04)f=' · A4 ⅓';
    else if(Math.abs(frac-1/2)<0.04)f=' · A4 ½';
    else if(Math.abs(frac-2/3)<0.04)f=' · A4 ⅔';
    else if(Math.abs(frac-1)<0.05)f=' · A4 1쪽';
    return Math.round(h)+'px'+f;
  }
  function iconBtn(svg,title,fn,disabled,extra){
    return el('button',{class:'icbtn'+(extra?' '+extra:''),title,html:svg,disabled:disabled?'disabled':null,onclick:fn});
  }
  function imgTools(block){
    const input=el('input',{type:'file',accept:'image/*',multiple:'true',style:'display:none',
      onchange:e=>{[...e.target.files].forEach(f=>ingestFile(block,f));e.target.value='';}});
    const add=el('button',{class:'minibtn',html:I.image+'<span>이미지</span>',title:'이미지 파일 추가',onclick:()=>input.click()});
    const tidy=el('button',{class:'minibtn',html:I.grid2+'<span>정돈</span>',title:'이미지 오·열 자동 정렬',onclick:()=>arrangeImgs(block)});
    return el('div',{class:'field-tools'},[add,tidy,input]);
  }

  /* ============================================================
     이미지 객체 렌더 + 조작
     ============================================================ */
  function blockNode(id){return $('.block[data-id="'+id+'"]');}
  function blockLayer(id){const n=blockNode(id);return n?$('.img-layer',n):null;}
  function reLayer(block){const l=blockLayer(block.id); if(l)renderImages(block,l); paginateSoon();}

  function renderImages(block,layer){
    layer.innerHTML='';
    const fieldEl=layer.parentElement&&layer.parentElement.querySelector('.f-prob');
    const imgs=block.imgs||[];
    if(fieldEl)fieldEl.classList.toggle('has-img',imgs.length>0);
    imgs.forEach(im=>{
      const obj=el('div',{class:'imgobj',data:{img:im.id}});
      const pic=el('img',{src:dispSrc(im),draggable:'false'});
      obj.appendChild(pic);
      obj.appendChild(imgToolbar(block,im));
      ['nw','ne','sw','se'].forEach(c=>obj.appendChild(el('span',{class:'ihandle '+c,data:{corner:c}})));
      positionImg(obj,im,layer);
      enableImgMove(obj,block,im,layer);
      enableImgResize(obj,block,im,layer);
      obj.addEventListener('pointerdown',e=>{if(e.target.closest('.ihandle')||e.target.closest('.img-tb'))return;selectImage(block.id,im.id);});
      layer.appendChild(obj);
    });
    applySel(layer);
  }
  function dispSrc(im){return im.sharpened&&im.sharpSrc?im.sharpSrc:im.src;}
  function positionImg(obj,im,layer){
    const pw=layer.clientWidth||1, ph=layer.clientHeight||1;
    let w=im.w*pw, h=w*im.ar;
    if(h>ph){h=ph;w=h/im.ar;im.w=w/pw;}
    let left=im.x*pw, top=im.y*ph;
    left=Math.max(0,Math.min(left,pw-w)); top=Math.max(0,Math.min(top,ph-h));
    obj.style.width=w+'px'; obj.style.left=left+'px'; obj.style.top=top+'px';
  }

  function imgToolbar(block,im){
    const bar=el('div',{class:'img-tb'});
    const mk=(html,title,fn,cls)=>el('button',{class:'tbb'+(cls?' '+cls:''),title,html,
      onpointerdown:e=>e.stopPropagation(),onclick:e=>{e.stopPropagation();fn();}});
    bar.append(
      mk('−','축소',()=>scaleImg(block,im,1/1.12)),
      mk('+','확대',()=>scaleImg(block,im,1.12)),
      mk(I.fit,'칸 너비에 맞추기',()=>{im.x=0.04;im.w=0.92;clampImg(block,im);save();reLayer(block);}),
      mk(I.sharp,'화질 보정 켜기/끄기',()=>toggleSharp(block,im),im.sharpened?'on':''),
      mk(I.trash,'삭제',()=>delImg(block,im),'danger'),
    );
    return bar;
  }
  function scaleImg(block,im,f){
    const layer=blockLayer(block.id); if(!layer)return;
    const pw=layer.clientWidth, ph=layer.clientHeight;
    const cx=im.x+im.w/2, cyTop=im.y, oldH=im.w*pw*im.ar/ph;
    const cy=cyTop+oldH/2;
    let nw=Math.max(0.06,Math.min(1,im.w*f));
    im.w=nw;
    const newH=im.w*pw*im.ar/ph;
    im.x=cx-im.w/2; im.y=cy-newH/2;
    clampImg(block,im); save(); reLayer(block);
  }
  function clampImg(block,im){
    const layer=blockLayer(block.id); if(!layer)return;
    const pw=layer.clientWidth, ph=layer.clientHeight;
    let w=im.w*pw, h=w*im.ar;
    if(h>ph){h=ph;w=h/im.ar;im.w=w/pw;}
    let left=Math.max(0,Math.min(im.x*pw,pw-w)), top=Math.max(0,Math.min(im.y*ph,ph-h));
    im.x=left/pw; im.y=top/ph;
  }
  function toggleSharp(block,im){
    if(im.sharpened){im.sharpened=false;save();reLayer(block);return;}
    if(im.sharpSrc){im.sharpened=true;save();reLayer(block);return;}
    const i=new Image();
    i.onload=()=>{const s=unsharp(i);if(s){im.sharpSrc=s;im.sharpened=true;}save();reLayer(block);};
    i.src=im.src;
  }
  function delImg(block,im){
    block.imgs=(block.imgs||[]).filter(o=>o.id!==im.id);
    if(selected&&selected.b===block.id&&selected.i===im.id)selected=null;
    save(); reLayer(block);
  }

  /* 선택 */
  function selectImage(bId,iId){selected={b:bId,i:iId};$$('.img-layer').forEach(applySel);}
  function deselectImage(){if(!selected)return;selected=null;$$('.img-layer').forEach(applySel);}
  function applySel(layer){
    $$('.imgobj',layer).forEach(o=>{
      const bn=o.closest('.block');
      const sel=selected&&bn&&+bn.dataset.id===selected.b&&+o.dataset.img===selected.i;
      o.classList.toggle('selected',!!sel);
    });
  }

  /* 이동 + 스냅 + 정렬 가이드 */
  function enableImgMove(obj,block,im,layer){
    const pic=obj.querySelector('img');
    pic.addEventListener('pointerdown',e=>{
      e.preventDefault(); selectImage(block.id,im.id);
      const z=curZoom(), pw=layer.clientWidth, ph=layer.clientHeight;
      const w=im.w*pw, h=w*im.ar;
      const sx=e.clientX, sy=e.clientY, startL=im.x*pw, startT=im.y*ph;
      const others=(block.imgs||[]).filter(o=>o.id!==im.id).map(o=>{const ow=o.w*pw;return{left:o.x*pw,top:o.y*ph,w:ow,h:ow*o.ar};});
      obj.setPointerCapture(e.pointerId); obj.classList.add('moving');
      const mv=ev=>{
        let nl=startL+(ev.clientX-sx)/z, nt=startT+(ev.clientY-sy)/z;
        const g=snap(nl,nt,w,h,pw,ph,others,layer); nl=g.left; nt=g.top;
        nl=Math.max(0,Math.min(nl,pw-w)); nt=Math.max(0,Math.min(nt,ph-h));
        obj.style.left=nl+'px'; obj.style.top=nt+'px';
        im.x=nl/pw; im.y=nt/ph;
      };
      const up=()=>{try{obj.releasePointerCapture(e.pointerId);}catch(_){}
        obj.classList.remove('moving'); obj.removeEventListener('pointermove',mv); obj.removeEventListener('pointerup',up);
        clearGuides(layer); save();};
      obj.addEventListener('pointermove',mv); obj.addEventListener('pointerup',up);
    });
  }
  function snap(nl,nt,w,h,pw,ph,others,layer){
    clearGuides(layer);
    const xC=[{p:0,g:0},{p:(pw-w)/2,g:pw/2},{p:pw-w,g:pw}];
    const yC=[{p:0,g:0},{p:(ph-h)/2,g:ph/2},{p:ph-h,g:ph}];
    others.forEach(o=>{
      xC.push({p:o.left,g:o.left},{p:o.left+o.w/2-w/2,g:o.left+o.w/2},{p:o.left+o.w-w,g:o.left+o.w});
      yC.push({p:o.top,g:o.top},{p:o.top+o.h/2-h/2,g:o.top+o.h/2},{p:o.top+o.h-h,g:o.top+o.h});
    });
    let bx=null,bxd=SNAP+1,bxg=0;
    xC.forEach(c=>{const d=Math.abs(nl-c.p);if(d<bxd){bxd=d;bx=c.p;bxg=c.g;}});
    let by=null,byd=SNAP+1,byg=0;
    yC.forEach(c=>{const d=Math.abs(nt-c.p);if(d<byd){byd=d;by=c.p;byg=c.g;}});
    if(bx!=null){nl=bx;addGuide(layer,'v',bxg);} else if(state.meta.grid!==false){nl=Math.round(nl/GRID)*GRID;}
    if(by!=null){nt=by;addGuide(layer,'h',byg);} else if(state.meta.grid!==false){nt=Math.round(nt/GRID)*GRID;}
    return {left:nl,top:nt};
  }
  function addGuide(layer,dir,pos){
    const g=el('div',{class:'galign '+dir});
    if(dir==='v')g.style.left=pos+'px'; else g.style.top=pos+'px';
    layer.appendChild(g);
  }
  function clearGuides(layer){$$('.galign',layer).forEach(n=>n.remove());}

  /* 리사이즈(확대축소) — 모서리, 비율 유지 */
  function enableImgResize(obj,block,im,layer){
    $$('.ihandle',obj).forEach(hd=>{
      hd.addEventListener('pointerdown',e=>{
        e.preventDefault(); e.stopPropagation(); selectImage(block.id,im.id);
        const z=curZoom(), pw=layer.clientWidth, ph=layer.clientHeight;
        const corner=hd.dataset.corner;
        const startW=im.w*pw, startH=startW*im.ar, startL=im.x*pw, startT=im.y*ph;
        const anchorX=corner.includes('w')?startL+startW:startL;
        const anchorY=corner.includes('n')?startT+startH:startT;
        const sx=e.clientX, dir=corner.includes('e')?1:-1;
        hd.setPointerCapture(e.pointerId); obj.classList.add('resizing');
        const mv=ev=>{
          let dw=(ev.clientX-sx)/z;
          let nw=Math.max(40,Math.min(pw,startW+dir*dw)), nh=nw*im.ar;
          if(nh>ph){nh=ph;nw=nh/im.ar;}
          let left=corner.includes('w')?anchorX-nw:anchorX;
          let top=corner.includes('n')?anchorY-nh:anchorY;
          left=Math.max(0,Math.min(left,pw-nw)); top=Math.max(0,Math.min(top,ph-nh));
          obj.style.width=nw+'px'; obj.style.left=left+'px'; obj.style.top=top+'px';
          im.w=nw/pw; im.x=left/pw; im.y=top/ph;
        };
        const up=()=>{try{hd.releasePointerCapture(e.pointerId);}catch(_){}
          obj.classList.remove('resizing'); hd.removeEventListener('pointermove',mv); hd.removeEventListener('pointerup',up); save();};
        hd.addEventListener('pointermove',mv); hd.addEventListener('pointerup',up);
      });
    });
  }

  /* 오·열 자동 정돈 — 동일 폭으로 세로 정렬(완벽한 열 맞춤) */
  function arrangeImgs(block){
    const imgs=block.imgs||[]; if(!imgs.length)return;
    const layer=blockLayer(block.id); if(!layer)return;
    const pw=layer.clientWidth, ph=layer.clientHeight;
    const pad=8/ph, gap=10/ph, wFrac=0.92;
    let totalH=0; imgs.forEach(im=>{totalH+=(wFrac*pw*im.ar)/ph;});
    totalH+=gap*(imgs.length-1)+pad*2;
    let scale=1; if(totalH>1) scale=1/totalH;
    let y=pad;
    imgs.forEach(im=>{
      im.w=wFrac*scale; im.x=(1-im.w)/2;
      im.y=y;
      const hh=(im.w*pw*im.ar)/ph;
      y+=hh+gap*scale;
    });
    save(); reLayer(block);
  }

  /* ============================================================
     옵션 팝오버
     ============================================================ */
  function makeOptions(b,node){
    const wrap=el('div',{class:'opt-wrap'});
    const pop=el('div',{class:'popover'});
    const btn=el('button',{class:'icbtn',title:'옵션',html:I.gear,
      onclick:e=>{e.stopPropagation();closePops(pop);pop.classList.toggle('open');}});
    function seg(opts,current,onPick){
      const row=el('div',{class:'seg'});
      opts.forEach(o=>{row.appendChild(el('button',{class:current===o.val?'on':'',onclick:()=>onPick(o.val)},[el('span',{class:'ico '+(o.ico||'')}),o.label]));});
      return row;
    }
    if(b.type==='concept'){
      pop.appendChild(el('div',{class:'pop-h',text:'설명 배경'}));
      pop.appendChild(seg([{val:'blank',label:'무지'},{val:'lines',label:'줄글',ico:'lines'},{val:'grid',label:'격자',ico:'grid'}],
        b.exBg,v=>{b.exBg=v;applyBg(node,'.f-ex',v);refreshSeg(pop,0,v);save();}));
      pop.appendChild(el('div',{class:'pop-h',text:'연한 배경'}));
      const tintRow=el('div',{class:'seg'},[
        el('button',{class:!b.tint?'on':'',onclick:()=>setTint(false)},[el('span',{class:'ico'}),'무배경']),
        el('button',{class:b.tint?'on':'',onclick:()=>setTint(true)},[el('span',{class:'ico tint'}),'연한 배경']),
      ]);
      function setTint(v){b.tint=v;$('.f-ex',node).classList.toggle('tint',v);[...tintRow.children].forEach((c,i)=>c.classList.toggle('on',(i===1)===v));save();}
      pop.appendChild(tintRow);
    }else{
      pop.appendChild(el('div',{class:'pop-h',text:'문제 배경'}));
      pop.appendChild(seg([{val:'blank',label:'무지'},{val:'lines',label:'줄글',ico:'lines'},{val:'grid',label:'격자',ico:'grid'}],
        b.probBg,v=>{b.probBg=v;applyBg(node,'.f-prob',v);refreshSeg(pop,0,v);save();}));
      pop.appendChild(el('div',{class:'pop-h',text:'풀이 배경'}));
      pop.appendChild(seg([{val:'blank',label:'무지'},{val:'lines',label:'줄글',ico:'lines'},{val:'grid',label:'격자',ico:'grid'}],
        b.solBg,v=>{b.solBg=v;applyBg(node,'.f-sol',v);refreshSeg(pop,1,v);save();}));
      pop.appendChild(el('div',{class:'pop-h',text:'이미지'}));
      pop.appendChild(el('button',{class:'pop-btn',html:I.grid2+'<span>이미지 오·열 정돈</span>',onclick:()=>{arrangeImgs(b);}}));
    }
    wrap.append(btn,pop);
    return wrap;
  }
  function refreshSeg(pop,segIdx,val){
    const segs=$$('.seg',pop), labels={blank:'무지',lines:'줄글',grid:'격자'};
    [...segs[segIdx].children].forEach(c=>c.classList.toggle('on',c.textContent.trim().endsWith(labels[val])));
  }
  function applyBg(node,sel,val){
    const f=$(sel,node); f.classList.remove('bg-lines','bg-grid');
    if(val==='lines')f.classList.add('bg-lines'); else if(val==='grid')f.classList.add('bg-grid');
  }
  function closePops(except){$$('.popover.open').forEach(p=>{if(p!==except)p.classList.remove('open');});}
  document.addEventListener('click',()=>closePops(null));
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.imgobj')&&!e.target.closest('.img-tb'))deselectImage();});

  /* ============================================================
     이동 / 삭제 / 드래그 정렬
     ============================================================ */
  function move(id,dir){
    syncFromDOM();
    const i=state.blocks.findIndex(b=>b.id===id), j=i+dir;
    if(j<0||j>=state.blocks.length)return;
    [state.blocks[i],state.blocks[j]]=[state.blocks[j],state.blocks[i]];
    save();render();
  }
  function del(id){syncFromDOM();state.blocks=state.blocks.filter(b=>b.id!==id);save();render();}

  let dragId=null;
  function attachDrag(handle,node,b){
    handle.addEventListener('dragstart',e=>{
      dragId=b.id;node.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(b.id));
      try{e.dataTransfer.setDragImage(node,20,20);}catch(_){}
    });
    handle.addEventListener('dragend',()=>{dragId=null;node.classList.remove('dragging');$$('.block').forEach(n=>n.classList.remove('drop-before','drop-after'));});
    node.addEventListener('dragover',e=>{
      if(dragId==null||dragId===b.id)return;e.preventDefault();
      const r=node.getBoundingClientRect();const after=(e.clientY-r.top)>r.height/2;
      node.classList.toggle('drop-after',after);node.classList.toggle('drop-before',!after);
    });
    node.addEventListener('dragleave',()=>node.classList.remove('drop-before','drop-after'));
    node.addEventListener('drop',e=>{
      if(dragId==null||dragId===b.id)return;e.preventDefault();syncFromDOM();
      const from=state.blocks.findIndex(x=>x.id===dragId);const moved=state.blocks.splice(from,1)[0];
      let to=state.blocks.findIndex(x=>x.id===b.id);const r=node.getBoundingClientRect();
      if((e.clientY-r.top)>r.height/2)to+=1;state.blocks.splice(to,0,moved);save();render();
    });
  }

  /* ============================================================
     크기/비율 조절
     ============================================================ */
  function curZoom(){return state.zoom||1;}
  function enableResize(handle,node,b,badge){
    handle.addEventListener('pointerdown',e=>{
      e.preventDefault();const z=curZoom();const startY=e.clientY,startH=b.h;
      handle.setPointerCapture(e.pointerId);
      const mv=ev=>{const h=Math.max(120,Math.round(startH+(ev.clientY-startY)/z));b.h=h;node.style.height=h+'px';badge.textContent=sizeLabel(h);updateGuides();};
      const up=()=>{handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);
        const blk=state.blocks.find(x=>x.id===+node.dataset.id);if(blk)reLayer(blk);save();paginate();};
      handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);
    });
  }
  function enableVSplit(div,node,b){
    div.addEventListener('pointerdown',e=>{
      e.preventDefault();const body=div.parentElement;const rect=body.getBoundingClientRect();
      div.setPointerCapture(e.pointerId);
      const mv=ev=>{let ratio=(ev.clientY-rect.top)/rect.height;ratio=Math.min(0.8,Math.max(0.2,ratio));b.ratio=ratio;
        const panels=$$('.panel',body);panels[0].style.flex=ratio;panels[1].style.flex=1-ratio;};
      const up=()=>{div.removeEventListener('pointermove',mv);div.removeEventListener('pointerup',up);reLayer(b);save();};
      div.addEventListener('pointermove',mv);div.addEventListener('pointerup',up);
    });
  }
  function enableSplit(div,node,b){
    div.addEventListener('pointerdown',e=>{
      e.preventDefault();const body=div.parentElement;const rect=body.getBoundingClientRect();
      div.setPointerCapture(e.pointerId);
      const mv=ev=>{let ratio=(ev.clientX-rect.left)/rect.width;ratio=Math.min(0.8,Math.max(0.2,ratio));b.ratio=ratio;
        const panels=$$('.panel',body);panels[0].style.flex=ratio;panels[1].style.flex=1-ratio;};
      const up=()=>{div.removeEventListener('pointermove',mv);div.removeEventListener('pointerup',up);reLayer(b);save();};
      div.addEventListener('pointermove',mv);div.addEventListener('pointerup',up);
    });
  }

  /* ============================================================
     A4 쪽 맞춤 + 경계 가이드 + 초과 경고
     ============================================================ */
  function paginate(){
    const stack=stackEl(); if(!stack)return;
    const blocks=$$('.block',stack);
    blocks.forEach(n=>n.style.marginTop='');
    if(state.meta.pageFit!==false){
      let idx=0;
      const limit=PAGE_H-PAGE_MARGIN*2;
      while(idx<blocks.length){
        const top0=blocks[idx].offsetTop; // 여백 적용 시 리플로우 반영
        let j=idx; const group=[];
        while(j<blocks.length&&Math.abs(blocks[j].offsetTop-top0)<2){group.push(blocks[j]);j++;}
        const top=top0;
        const bottom=top+Math.max(...group.map(n=>n.offsetHeight));
        const pageBottom=Math.floor(top/PAGE_H)*PAGE_H+PAGE_H;
        if((bottom-top)<=limit&&bottom>pageBottom-PAGE_MARGIN){
          const push=(pageBottom+CONT_H)-top;
          if(push>0)group.forEach(n=>n.style.marginTop=push+'px');
        }
        idx=j;
      }
    }
    updateGuides(); checkOverflow();
  }
  function checkOverflow(){
    const limit=PAGE_H-PAGE_MARGIN*2;
    $$('.block').forEach(n=>n.classList.toggle('over',n.offsetHeight>limit));
  }
  function updateGuides(){
    const sheet=$('#sheet'); let g=$('#pageGuides');
    if(!g){g=el('div',{class:'page-guides',id:'pageGuides'});sheet.appendChild(g);}
    g.innerHTML='';
    const total=sheet.scrollHeight;
    const name=(state.meta.title||'').trim();
    for(let y=PAGE_H,p=2;y<total;y+=PAGE_H,p++){
      g.appendChild(el('div',{class:'pbreak',style:'top:'+y+'px'}));
      const titleWrap=el('div',{class:'pc-title'},[el('span',{class:'pc-eyebrow',text:'이어서'})]);
      if(name)titleWrap.appendChild(el('span',{class:'pc-name',text:name}));
      g.appendChild(el('div',{class:'pcont',style:'top:'+(y+8)+'px'},[
        titleWrap,
        el('span',{class:'pc-page',text:p+' / '+lastPage()+' 쪽'}),
      ]));
    }
  }
  function lastPage(){const t=$('#sheet'); return t?Math.max(1,Math.ceil(t.scrollHeight/PAGE_H)):1;}

  /* ============================================================
     줌
     ============================================================ */
  function applyZoom(){
    const sheet=$('#sheet');const z=curZoom();
    sheet.style.transform='scale('+z+')';
    $('#sheetWrap').style.height=(sheet.offsetHeight*z)+'px';
    $('#zlabel').textContent=Math.round(z*100)+'%';
  }
  function setZoom(z){state.zoom=Math.min(1.5,Math.max(0.4,z));save();applyZoom();}

  /* ============================================================
     셸
     ============================================================ */
  function buildShell(){
    const app=$('#app');
    app.appendChild(el('div',{class:'brand'},[el('div',{class:'mark'}),el('h1',{html:'코넬 학습지 <span>빌더</span>'})]));
    const zoomGroup=el('div',{class:'toolgroup'},[
      el('button',{class:'zbtn',text:'−',onclick:()=>setZoom(curZoom()-0.1)}),
      el('span',{class:'zlabel',id:'zlabel',text:'100%'}),
      el('button',{class:'zbtn',text:'+',onclick:()=>setZoom(curZoom()+0.1)}),
    ]);
    app.appendChild(el('div',{class:'topbar'},[
      zoomGroup,el('div',{class:'spacer'}),
      el('button',{class:'tbtn ghost',text:'전체 비우기',onclick:resetAll}),
      el('button',{class:'tbtn primary',html:I.print+'<span>인쇄 / PDF</span>',onclick:()=>window.print()}),
    ]));
    const sidebar=el('aside',{class:'sidebar'});
    sidebar.appendChild(el('div',{class:'side-section'},[
      el('div',{class:'side-h',text:'블록 추가'}),
      el('div',{class:'palette'},[
        paletteCard('problem','문제풀이','문제 · 풀이 가로 배열. 문제칸에 캡처를 Ctrl+V로 삽입. 기본 A4 ⅓.',thumbProblem()),
        paletteCard('concept','개념설명','개념 이름 · 설명 세로 배열. 줄글/격자, 연한 배경 선택.',thumbConcept()),
        paletteCard('mock','모의고사','가로 A4 ½ 폭 · 세로 2단. 문제 위, 긴 풀이 아래. 두 개가 나란히.',thumbMock()),
      ]),
    ]));
    sidebar.appendChild(el('div',{class:'side-section'},[
      el('div',{class:'side-h',text:'학습지 옵션'}),
      el('div',{},[
        optRow('헤더(제목·이름칸) 표시',state.meta.showHead,v=>{state.meta.showHead=v;save();renderHead();paginateSoon();}),
        optRow('이미지 격자 스냅',state.meta.grid!==false,v=>{state.meta.grid=v;save();}),
        optRow('A4 쪽 경계 맞춤',state.meta.pageFit!==false,v=>{state.meta.pageFit=v;save();paginate();}),
      ]),
    ]));
    sidebar.appendChild(el('div',{class:'side-section'},[
      el('div',{class:'side-note',html:'<b>이미지</b> · 문제 칸을 클릭하고 <b>Ctrl+V</b>로 캡처를 붙여넣으세요. 넣은 뒤 드래그로 이동, 모서리로 확대/축소, 위쪽 툴바에서 화질 보정·정렬을 조절합니다. <b>정돈</b> 버튼은 이미지를 오·열에 맞춰 자동 정렬해요. 블록이 A4 쪽을 넘으면 자동으로 다음 쪽으로 넘어갑니다.'}),
    ]));
    app.appendChild(sidebar);
    const sheet=el('div',{class:'sheet',id:'sheet',data:{screenLabel:'A4 학습지'}});
    sheet.appendChild(el('div',{class:'sheet-head',id:'sheetHead'}));
    sheet.appendChild(el('div',{class:'stack',id:'stack'}));
    app.appendChild(el('main',{class:'canvas',id:'canvas'},el('div',{class:'sheet-wrap',id:'sheetWrap'},sheet)));
  }
  function paletteCard(type,title,desc,thumb){
    return el('button',{class:'pcard',onclick:()=>addBlock(type)},[
      el('div',{class:'pthumb'},thumb),
      el('div',{},[el('p',{class:'ptitle',text:title}),el('p',{class:'pdesc',text:desc})]),
    ]);
  }
  function thumbProblem(){return el('div',{class:'th-row'},[el('div',{class:'th-box',style:'flex:1'}),el('div',{class:'th-box th-lines',style:'flex:1'})]);}
  function thumbConcept(){return el('div',{class:'th-col'},[el('div',{class:'th-box fill th-bar'}),el('div',{class:'th-box th-lines',style:'flex:1'})]);}
  function thumbMock(){return el('div',{class:'th-row'},[el('div',{class:'th-col',style:'position:relative;inset:auto;flex:1'},[el('div',{class:'th-box',style:'flex:.4'}),el('div',{class:'th-box th-lines',style:'flex:1'})]),el('div',{style:'flex:1'})]);}
  function optRow(label,val,fn){
    const input=el('input',{type:'checkbox',onchange:e=>fn(e.target.checked)});
    if(val)input.checked=true;
    return el('div',{class:'opt-row'},[el('label',{text:label}),el('label',{class:'switch'},[input,el('span',{class:'track'})])]);
  }
  function renderHead(){
    const head=$('#sheetHead');head.innerHTML='';head.style.display=state.meta.showHead?'':'none';
    if(!state.meta.showHead)return;
    head.appendChild(el('div',{class:'sheet-eyebrow',text:'CORNELL STUDY SHEET · 학습지'}));
    const title=el('div',{class:'sheet-title',contenteditable:'true',spellcheck:'false',data:{ph:'학습지 제목을 입력하세요'}});
    title.textContent=state.meta.title||'';
    title.addEventListener('input',()=>{state.meta.title=title.textContent;scheduleSave();paginateSoon();});
    head.appendChild(title);
    head.appendChild(el('div',{class:'sheet-meta'},[metaField('이름'),metaField('학년 · 반'),metaField('날짜')]));
  }
  function metaField(label){return el('div',{class:'meta-field'},[el('span',{text:label}),el('span',{class:'meta-line'})]);}
  function resetAll(){
    if(!confirm('모든 블록과 내용을 지울까요?'))return;
    state={meta:{title:'',showHead:true,grid:state.meta.grid,pageFit:state.meta.pageFit},blocks:[],zoom:state.zoom};
    seq=1;imgSeq=1;selected=null;save();renderHead();render();applyZoom();
  }

  /* ---------- 부팅 ---------- */
  if(seeded){state.blocks=[makeBlock('problem'),makeBlock('concept'),makeBlock('mock'),makeBlock('mock')];save();}
  buildShell(); renderHead(); render(); applyZoom();
  window.addEventListener('beforeprint',()=>{$('#sheet').style.transform='none';});
  window.addEventListener('afterprint',applyZoom);
  new ResizeObserver(()=>{applyZoom();paginateSoon();}).observe($('#sheet'));
})();
</script>
